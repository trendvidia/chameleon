//
// Vendored copy of the canonical pxf.Secret well-known type for this
// example. The authoritative definition lives in the protowire spec
// at proto/pxf/secret.proto. Production buf setups depending on
// `buf.build/trendvidia/protowire` (or a workspace dep) get this
// definition transitively and don't need a local copy.

syntax = "proto3";
package pxf;

// Generated Go lands in this example's own gen tree, mirroring the
// pattern that myapp/v1/config.proto uses. The canonical protowire
// repo intentionally publishes no `go_package` on secret.proto — each
// consumer picks a path in their own module. Real-world setups
// depending on `buf.build/trendvidia/protowire` via the BSR get the
// proto definition transitively and configure `go_package` via their
// own buf.gen.yaml managed-mode rules instead of patching the .proto.
option go_package = "github.com/trendvidia/chameleon/examples/buf/gen/go/pxf;pxfv1";

message Secret {
  string value = 1;
  string hint = 2;
  string fingerprint = 3;
}
