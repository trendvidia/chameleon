# buf workspace configuration for the chameleon example.
#
# This example demonstrates how a consumer wires protoc-gen-chameleon-go
# into a `buf` workflow. Run from this directory:
#
#   buf generate
#
# That produces:
#   gen/go/myapp/v1/config.pb.go         (from protoc-gen-go)
#   gen/go/myapp/v1/config.chameleon.go  (from protoc-gen-chameleon-go)
#
# Prerequisites on the user's PATH:
#   protoc-gen-go               go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   protoc-gen-chameleon-go     go install github.com/trendvidia/chameleon/cmd/protoc-gen-chameleon-go@latest
#
# pxf/secret.proto is vendored locally under proto/pxf/ to keep the
# example self-contained. Production setups typically depend on the
# protowire spec via BSR (`buf.build/trendvidia/protowire`) or a buf
# workspace dep, so the import resolves the same way as any other
# WKT — no vendoring required.

version: v2

modules:
  - path: proto

# Lint and breaking config kept loose for the example. Real consumers
# tighten these to the buf-recommended defaults.
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
