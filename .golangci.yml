version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
        - (io.Closer).Close

    gosec:
      excludes:
        - G101 # potential hardcoded credentials — false positives in test fixtures + secret-handling code
        - G115 # integer overflow conversion — protowire wire format requires these casts

    revive:
      rules:
        - name: exported
          disabled: true # protogen-emitted identifiers trigger this; godoc lives in upstream proto sources
        - name: package-comments
          disabled: true # generated files dominate; manual package docs in selected files
        - name: var-naming
          disabled: true # codegen identifiers follow proto's naming, not Go's

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    rules:
      # Generated code: skip everything.
      - path: '\.pb\.go$'
        linters: [all]
      - path: '\.chameleon\.go$'
        linters: [all]

      # Tests: relax security + complexity rules; setup code commonly returns errors we don't propagate.
      - path: '_test\.go$'
        linters: [gosec, errcheck, noctx, prealloc]

      # Fuzz targets: fuzz inputs are by definition untrusted; gosec false-positives.
      - path: 'fuzz_test\.go$'
        linters: [gosec]

      # Plugin codegen emits string templates — gosec G203 (HTML-unescaped) false-positives.
      - path: 'cmd/protoc-gen-chameleon-go/'
        linters: [gosec]

      # CLI subcommands print user-provided paths verbatim; that's the feature, not a finding.
      - path: 'cmd/chameleon/'
        linters: [gosec]
        text: 'G304' # file path provided as taint input

      # hack/ is repo-local developer tooling run by a maintainer at a
      # terminal: it takes file paths as flags by design (G304, and G703's
      # taint analysis of the same flag reaching a write), and the
      # CHANGELOG.md it writes is a tracked file that has to stay
      # world-readable (G306). None of it reaches untrusted input.
      - path: 'hack/'
        linters: [gosec]
        text: 'G304|G306|G703'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Formatting is gofumpt, applied through golangci-lint rather than a
# separate binary: this config is already pinned and CI already installs
# it, so `make fmt` needs no tool the lint job does not have. gofumpt is
# a strict superset of gofmt -s, so nothing here contradicts `go fmt`.
formatters:
  enable:
    - gofumpt

  settings:
    gofumpt:
      # Base rules only. Measured against v2.12.2 rather than assumed:
      # the one extra rule that actually fires in this tree is same-type
      # parameter grouping (`func f(a int, b int)` -> `func f(a, b int)`),
      # which rewrites hand-written signatures for no readability gain.
      # Two things the extras are commonly believed to cover but do not:
      # octal normalization (0777 -> 0o777) is a *base* rule and applies
      # either way, and golangci-lint's bundled gofumpt never performs
      # interface{} -> any at all.
      extra-rules: false

  exclusions:
    # Generated files are rewritten by `make generate`, so formatting
    # them is churn that reverts on the next buf run. `strict` keys off
    # the "Code generated ... DO NOT EDIT." header, which every .pb.go
    # here carries; the explicit paths cover the ones that do not.
    generated: strict
    paths:
      - 'examples/buf/gen'
      - '\.pb\.go$'
      - '\.chameleon\.go$'
