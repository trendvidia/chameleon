# Generation config for chameleon's own protos.
#
# Run from this directory:
#
#   buf generate
#
# Produces:
#   chameleon/v1/chain.pb.go
#   chameleon/v1/layer.pb.go
#   pxf/annotations.pb.go        (the extension type registry)
#
# Prerequisites: protoc-gen-go on the PATH.
version: v2

plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
