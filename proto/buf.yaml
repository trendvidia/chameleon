# buf module for chameleon's own proto definitions. Generated Go
# bindings land in proto/chameleon/v1/*.pb.go (see proto/buf.gen.yaml).
#
# pxf/annotations.proto is vendored under proto/pxf/ rather than
# pulled from BSR. The annotation extensions are also implemented in
# Go inside protowire-go; the .proto definition is only needed at
# codegen time for descriptor generation.
version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX

breaking:
  use:
    - FILE
