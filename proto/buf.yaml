# buf module for chameleon's own proto definitions. Generated Go
# bindings land in proto/chameleon/v1/*.pb.go (see proto/buf.gen.yaml).
#
# pxf/annotations.proto is vendored under proto/pxf/ rather than
# pulled from BSR. It is a byte-for-byte copy of the file in
# github.com/trendvidia/protos, whose pxf package is its Go; buf compiles
# it but generates nothing for it (see buf.gen.yaml).
# TestVendoredPxfSourcesMatchProtos keeps the copy current.
version: v2

modules:
  - path: .

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX

breaking:
  use:
    - FILE
