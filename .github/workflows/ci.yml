name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up go-plus
        uses: trendvidia/setup-go-plus@da0dff727fa2ad30f98e5318191f39c2b55b9f20 # v1
        with:
          version: v1.26.5
          app-id: ${{ secrets.GOPLUS_APP_ID }}
          private-key: ${{ secrets.GOPLUS_APP_KEY }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (with race detector)
        run: go test -race -timeout 5m ./...
      - name: integration tests (real sops round-trip)
        run: go test -tags=integration -timeout 5m ./sops/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up go-plus
        uses: trendvidia/setup-go-plus@da0dff727fa2ad30f98e5318191f39c2b55b9f20 # v1
        with:
          version: v1.26.5
          app-id: ${{ secrets.GOPLUS_APP_ID }}
          private-key: ${{ secrets.GOPLUS_APP_KEY }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  bench:
    name: bench (vs main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up go-plus
        uses: trendvidia/setup-go-plus@da0dff727fa2ad30f98e5318191f39c2b55b9f20 # v1
        with:
          version: v1.26.5
          app-id: ${{ secrets.GOPLUS_APP_ID }}
          private-key: ${{ secrets.GOPLUS_APP_KEY }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: benchmark PR head
        run: go test -bench=. -benchmem -count=5 -run='^$' -benchtime=500ms ./... | tee /tmp/bench-new.txt
      - name: benchmark main baseline
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          git switch --detach origin/main
          go test -bench=. -benchmem -count=5 -run='^$' -benchtime=500ms ./... | tee /tmp/bench-old.txt
          git switch -
      - name: compare with benchstat
        continue-on-error: true
        run: |
          if [ -s /tmp/bench-old.txt ]; then
            benchstat /tmp/bench-old.txt /tmp/bench-new.txt
          else
            echo "No baseline available (main has no benchmarks yet); PR-head results:"
            cat /tmp/bench-new.txt
          fi
