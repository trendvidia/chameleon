name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately no `branches:` filter, unlike `push:` above. A filter
    # here matches the PR's BASE, so `branches: [main]` gave a PR stacked
    # on anything else zero checks — not a failure, not a skip, an empty
    # check list that reads as green (#147). Stacking is the normal shape
    # here: a dependency bump lands on its own branch and the follow-up
    # that needs the new API targets the bump, which is exactly the change
    # that most wants a Linux leg. An allowlist of base prefixes was the
    # alternative and would be wrong again, silently, for the next prefix
    # nobody predicted. The cost is bounded — small PR volume, and the
    # concurrency block below cancels a run its own branch superseded.
    #
    # `labeled`/`unlabeled` are on top of the default three
    # (opened/synchronize/reopened) solely so the changelog gate
    # re-evaluates when someone applies `skip-changelog`: no event fires
    # on a label otherwise, and "Re-run failed jobs" replays the original
    # payload, in which the label is still absent. Every other job skips
    # a label event — see the `if:` they carry — so this costs one cheap
    # Linux run, not a full matrix.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Every job runs on GitHub-hosted runners. On a public repo a self-hosted
# runner would execute any fork PR's code on a real machine (#198). Go comes from actions/setup-go at the version go.mod declares —
# the oldest this module promises to build with, so CI tests the promise
# rather than whatever is newest.
#
# A newer push to the same PR or branch makes the run in flight moot;
# macOS minutes are the expensive ones, so cancel it rather than finish it.
# Label events get a group of their own: they run only the changelog job,
# and sharing the group let adding `skip-changelog` cancel the PR's real
# test run, leaving it with no result at all.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    # Nothing a label changes can change a test result; only the
    # changelog job cares about the label events in the trigger above.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ${{ matrix.runs-on }}
    # A hung test otherwise holds the runner for GitHub's default six
    # hours. This is a circuit breaker, not a budget.
    timeout-minutes: 20
    strategy:
      # Both legs always report. A macOS-only failure is exactly the signal
      # this matrix exists to surface, and fail-fast would hide it behind
      # whichever leg happened to finish first.
      fail-fast: false
      matrix:
        # Linux is not decoration for a library that mlocks pages (memguard),
        # shells out to `go list` in its own tests, and pins its module graph
        # (#130). It is also what most consumers deploy on. macOS stays:
        # memguard's page locking is OS-specific code, and macOS is where
        # most of this repo is developed.
        include:
          - name: macos-arm64
            runs-on: macos-15
          - name: linux-amd64
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sops/go.sum
            cmd/chameleon/go.sum
      # Every step below goes through make so the module walk has exactly
      # one definition, the Makefile's MODULES. Inlined here, CI and the
      # Makefile drift while the Makefile header calls `make ci` "what CI
      # runs" — and a per-module target that silently skips a module is
      # green for the wrong reason. modules-check is the guard on the
      # definition itself.
      # macOS ships GNU Make 3.81, which predates .SHELLFLAGS and so runs
      # every recipe without -e: a `for m in $(MODULES)` loop then reports
      # only its LAST module, and a failure in the library or in sops is
      # discarded (#171). Every make call in this file has to be >= 3.82.
      #
      # Homebrew leaves /usr/bin/make alone and installs GNU Make as
      # `gmake`, with a gnubin directory holding it under its normal name —
      # which is what that directory is for. Prepending it gives `make` =
      # GNU Make without renaming a single call, so the matrix legs keep one
      # command and `make ci-check` keeps matching the `make <target>` lines
      # it reads this file for. The hosted macOS image has Homebrew but not
      # necessarily its make formula, hence the install.
      #
      # The PATH line is unconditional on purpose: the directory does not
      # exist on Linux, and a PATH entry that does not exist is skipped, so
      # one step serves every job. If it is ever missing on a Mac, the
      # version assert is what says so.
      - name: Install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew list make >/dev/null 2>&1 || brew install make
      - name: Prefer Homebrew GNU Make on PATH
        run: echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      # Printed as well as asserted: nothing in a CI log said which make a
      # runner had, so #171 — .SHELLFLAGS being inert under 3.81, and every
      # per-module loop reporting only its last module — could not be ruled
      # out here from the outside. The Makefile refuses to run under 3.81
      # anyway; this names the problem at a step called after it rather than
      # in the middle of the first target that happens to invoke make.
      - name: Assert GNU Make >= 3.82
        run: |
          make --version | head -1
          v=$(make --version | head -1 | sed -E 's/^GNU Make //')
          [ "$(printf '%s\n3.82\n' "$v" | sort -V | head -1)" = "3.82" ] || {
            echo "::error::runner has GNU Make $v; the Makefile needs >= 3.82 (chameleon#171)"
            exit 1
          }
      - name: modules-check (MODULES vs go.work)
        run: make modules-check
      # The same guard, one level up: modules-check keeps the module list
      # honest, ci-check keeps *this step list* and `make ci` from drifting
      # apart. A step added below and not to CI_TARGETS reds here, which is
      # the failure #165 asked for — a comment saying "keep them in step"
      # is what did not stop it the first time.
      - name: ci-check (this workflow vs `make ci`)
        run: make ci-check
      - name: build
        run: make compile
      - name: vet
        run: make vet
      - name: test (with race detector)
        run: make test
      - name: integration tests (real sops round-trip)
        run: make test-integration
      - name: modules are tidy
        # A stray import that drags the KMS tree back into the library
        # module's go.mod is the regression #130 was about;
        # TestLibraryModuleRequiresNoKeyManagement catches it, but only
        # if go.mod reflects the imports. go.work.sum is in the checked
        # set too — see the target.
        #
        # The check itself lives in the Makefile so `make ci` can run the
        # same one. Inlined here it drifted: `make ci` did not have it,
        # said it reproduced this matrix, and a green local run pushed a
        # PR that went red on this very step (#164). #165 is the issue
        # that came out of it.
        run: make tidy-check

  changelog:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Same circuit breaker as `test`, and for the same reason.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch to diff against; a shallow clone has no
          # merge-base to compare the PR's file list to. This fetches
          # every ref, so the step below must not re-fetch at a depth —
          # that would graft origin/<base> back to a single commit and
          # take the merge-base away again.
          fetch-depth: 0
      # changelog-check runs hack/changelog with `go run`.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sops/go.sum
            cmd/chameleon/go.sum
      # Same one-liner as the other jobs; a no-op here, kept so every job
      # that calls make gets its PATH the same way. See the test job.
      - name: Prefer Homebrew GNU Make on PATH
        run: echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Validate fragment names
        run: make changelog-check
      - name: Require a fragment (or the skip-changelog label)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          # The base branch tip as recorded on the event, not origin/main
          # at run time. Once the PR is merged, origin/main contains it,
          # the merge-base becomes the PR head, and the diff shows nothing
          # added — a false "no fragment" on a PR merged before this job
          # ran (#190). fetch-depth 0 already has this commit.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Check the base explicitly. Folding this into the diff and
          # absorbing failures with `|| true` reports "no fragment" for a
          # broken ref just as loudly as for a real omission, and sends
          # the contributor looking in the wrong place.
          git cat-file -e "$BASE_SHA^{commit}" || {
            echo "::error::base commit $BASE_SHA is not in the checkout"
            exit 1
          }
          changed=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- changelog.d) || {
            echo "::error::git diff against $BASE_SHA failed"
            exit 1
          }
          # grep exits 1 when it filters everything out, which is a
          # legitimate "no fragments"; only its failure is swallowed here.
          added=$(printf '%s\n' "$changed" | grep -v 'changelog.d/README.md' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR adds no changelog.d/ fragment."
            echo ""
            echo "Add one — see changelog.d/README.md:"
            echo "    changelog.d/<issue-or-pr>.<added|changed|deprecated|removed|fixed|security|internal>.md"
            echo ""
            echo "If this change genuinely has nothing to tell a consumer"
            echo "(pure refactor, CI-only, typo) — or it is the release PR,"
            echo "which consumes fragments rather than adding one — label"
            echo "the PR 'skip-changelog'."
            exit 1
          fi
          echo "Fragment(s) added:"; echo "$added"

  lint:
    name: lint
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sops/go.sum
            cmd/chameleon/go.sum
      # See the test job for why this is here and why it is unconditional.
      - name: Prefer Homebrew GNU Make on PATH
        run: echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - name: golangci-lint (library)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
      - name: golangci-lint (sops)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: sops
      - name: golangci-lint (cli)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: cmd/chameleon
      # Runs after the actions above because they are what put the pinned
      # golangci-lint on PATH; `make fmt-check` shells out to it rather than
      # to a standalone gofumpt, so the version that checks formatting here
      # is the same one `make fmt` applies locally.
      #
      # Not redundant with those three steps, though it looks it: the
      # `formatters:` block means `golangci-lint run` reports gofumpt
      # issues too, but `run` only ever loads files matching the current
      # build tags. Every `//go:build integration` file (sops/ and
      # cmd/chameleon/ integration tests) is invisible to it and is checked
      # only here. Running last also means a formatting failure never masks
      # the lint findings — both land in one job.
      - name: gofumpt (all modules)
        run: make fmt-check
