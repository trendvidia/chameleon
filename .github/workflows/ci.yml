name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately no `branches:` filter, unlike `push:` above. A filter
    # here matches the PR's BASE, so `branches: [main]` gave a PR stacked
    # on anything else zero checks — not a failure, not a skip, an empty
    # check list that reads as green (#147). Stacking is the normal shape
    # here: a dependency bump lands on its own branch and the follow-up
    # that needs the new API targets the bump, which is exactly the change
    # that most wants a Linux leg. An allowlist of base prefixes was the
    # alternative and would be wrong again, silently, for the next prefix
    # nobody predicted. The cost is bounded — private repo, self-hosted
    # runners, small PR volume.
    #
    # `labeled`/`unlabeled` are on top of the default three
    # (opened/synchronize/reopened) solely so the changelog gate
    # re-evaluates when someone applies `skip-changelog`: no event fires
    # on a label otherwise, and "Re-run failed jobs" replays the original
    # payload, in which the label is still absent. Every other job skips
    # a label event — see the `if:` they carry — so this costs one cheap
    # run on the Linux box, not a full matrix.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Self-hosted runners execute workflow code on real machines, which is why
# they are a bad idea on public repos: any fork PR would run there. chameleon
# is private, so the only code that reaches them is code someone with push
# access already wrote.
#
# Two runners serve this repo: `mac-arm64-mini-chameleon` (the mini) and
# `chameleon-trader` (the Linux VPS that already hosts runners for voya, fyne
# and friends). Both `runs-on` lists below name an OS *and* an arch label —
# `[self-hosted]` alone would let either leg land on either box, silently and
# only sometimes.
jobs:
  test:
    name: test (${{ matrix.name }})
    # Nothing a label changes can change a test result; only the
    # changelog job cares about the label events in the trigger above.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ${{ matrix.runs-on }}
    # A wedged self-hosted runner otherwise blocks the queue for every repo on
    # the same box. Warm runs finish in well under a minute; this is a
    # circuit breaker, not a budget.
    timeout-minutes: 20
    strategy:
      # Both legs always report. A macOS-only failure is exactly the signal
      # this matrix exists to surface, and fail-fast would hide it behind
      # whichever leg happened to finish first.
      fail-fast: false
      matrix:
        # Linux is not decoration for a library that mlocks pages (memguard),
        # shells out to `go list` in its own tests, and pins its module graph
        # (#130). It is also what most consumers deploy on, while the only
        # runner this repo had was a Mac.
        include:
          - name: macos-arm64
            runs-on: [self-hosted, macOS, ARM64]
          - name: linux-amd64
            runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Assert go-plus toolchain
        run: |
          go version
          # The fork stamps either "(plus)" or "(plus <fork-version>)" onto the
          # version string depending on how it was built — match the prefix, not
          # the bare token, so a toolchain bump doesn't red every job in the repo.
          go version | grep -q '(plus' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      # Every step below goes through make so the module walk has exactly
      # one definition, the Makefile's MODULES. Inlined here, CI and the
      # Makefile drift while the Makefile header calls `make ci` "what CI
      # runs" — and a per-module target that silently skips a module is
      # green for the wrong reason. modules-check is the guard on the
      # definition itself.
      - name: modules-check (MODULES vs go.work)
        run: make modules-check
      # The same guard, one level up: modules-check keeps the module list
      # honest, ci-check keeps *this step list* and `make ci` from drifting
      # apart. A step added below and not to CI_TARGETS reds here, which is
      # the failure #165 asked for — a comment saying "keep them in step"
      # is what did not stop it the first time.
      - name: ci-check (this workflow vs `make ci`)
        run: make ci-check
      - name: build
        run: make compile
      - name: vet
        run: make vet
      - name: test (with race detector)
        run: make test
      - name: integration tests (real sops round-trip)
        run: make test-integration
      - name: modules are tidy
        # A stray import that drags the KMS tree back into the library
        # module's go.mod is the regression #130 was about;
        # TestLibraryModuleRequiresNoKeyManagement catches it, but only
        # if go.mod reflects the imports. go.work.sum is in the checked
        # set too — see the target.
        #
        # The check itself lives in the Makefile so `make ci` can run the
        # same one. Inlined here it drifted: `make ci` did not have it,
        # said it reproduced this matrix, and a green local run pushed a
        # PR that went red on this very step (#164). #165 is the issue
        # that came out of it.
        run: make tidy-check

  changelog:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    # Same circuit breaker as `test`, and for the same reason: this box
    # is shared, and a job with no timeout holds a runner for GitHub's
    # default six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch to diff against; a shallow clone has no
          # merge-base to compare the PR's file list to. This fetches
          # every ref, so the step below must not re-fetch at a depth —
          # that would graft origin/<base> back to a single commit and
          # take the merge-base away again.
          fetch-depth: 0
      - name: Validate fragment names
        run: make changelog-check
      - name: Require a fragment (or the skip-changelog label)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Resolve the merge-base explicitly. Folding this into the diff
          # and absorbing failures with `|| true` reports "no fragment"
          # for a broken ref just as loudly as for a real omission, and
          # sends the contributor looking in the wrong place.
          base=$(git merge-base "origin/$BASE" HEAD) || {
            echo "::error::cannot resolve the merge-base of origin/$BASE and HEAD"
            exit 1
          }
          changed=$(git diff --name-only --diff-filter=A "$base" HEAD -- changelog.d) || {
            echo "::error::git diff against $base failed"
            exit 1
          }
          # grep exits 1 when it filters everything out, which is a
          # legitimate "no fragments"; only its failure is swallowed here.
          added=$(printf '%s\n' "$changed" | grep -v 'changelog.d/README.md' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR adds no changelog.d/ fragment."
            echo ""
            echo "Add one — see changelog.d/README.md:"
            echo "    changelog.d/<issue-or-pr>.<added|changed|deprecated|removed|fixed|security|internal>.md"
            echo ""
            echo "If this change genuinely has nothing to tell a consumer"
            echo "(pure refactor, CI-only, typo) — or it is the release PR,"
            echo "which consumes fragments rather than adding one — label"
            echo "the PR 'skip-changelog'."
            exit 1
          fi
          echo "Fragment(s) added:"; echo "$added"

  lint:
    name: lint
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Assert go-plus toolchain
        run: |
          go version
          # The fork stamps either "(plus)" or "(plus <fork-version>)" onto the
          # version string depending on how it was built — match the prefix, not
          # the bare token, so a toolchain bump doesn't red every job in the repo.
          go version | grep -q '(plus' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      - name: golangci-lint (library)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: golangci-lint (sops)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: sops
      - name: golangci-lint (cli)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: cmd/chameleon
      # Runs after the actions above because they are what put the pinned
      # golangci-lint on PATH; `make fmt-check` shells out to it rather than
      # to a standalone gofumpt, so the version that checks formatting here
      # is the same one `make fmt` applies locally.
      #
      # Not redundant with those three steps, though it looks it: the
      # `formatters:` block means `golangci-lint run` reports gofumpt
      # issues too, but `run` only ever loads files matching the current
      # build tags. Every `//go:build integration` file (sops/ and
      # cmd/chameleon/ integration tests) is invisible to it and is checked
      # only here. Running last also means a formatting failure never masks
      # the lint findings — both land in one job.
      - name: gofumpt (all modules)
        run: make fmt-check

  bench:
    name: bench (vs main)
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'labeled'
      && github.event.action != 'unlabeled'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert go-plus toolchain
        run: |
          go version
          # The fork stamps either "(plus)" or "(plus <fork-version>)" onto the
          # version string depending on how it was built — match the prefix, not
          # the bare token, so a toolchain bump doesn't red every job in the repo.
          go version | grep -q '(plus' || { echo "::error::runner go is not the go-plus fork"; exit 1; }
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      # Benchmarks live in the library module; the sops and CLI modules
      # have none. Add them here if that changes.
      - name: benchmark PR head
        run: go test -bench=. -benchmem -count=5 -run='^$' -benchtime=500ms ./... | tee /tmp/bench-new.txt
      - name: benchmark main baseline
        continue-on-error: true
        run: |
          git fetch origin main --depth=1
          git switch --detach origin/main
          go test -bench=. -benchmem -count=5 -run='^$' -benchtime=500ms ./... | tee /tmp/bench-old.txt
          git switch -
      - name: compare with benchstat
        continue-on-error: true
        run: |
          if [ -s /tmp/bench-old.txt ]; then
            benchstat /tmp/bench-old.txt /tmp/bench-new.txt
          else
            echo "No baseline available (main has no benchmarks yet); PR-head results:"
            cat /tmp/bench-new.txt
          fi
